name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        elixir: ['1.18', '1.19']
        otp: ['28']
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          version-type: loose

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix test --only stress

      - name: Build example release
        working-directory: example
        run: |
          mix deps.get
          MIX_ENV=prod mix release

      - name: Start example daemon
        working-directory: example/_build/prod/rel/example
        run: |
          ./bin/example daemon
          for _ in $(seq 1 20); do
            [ -S example.sock ] && exit 0
            sleep 0.5
          done
          echo "example.sock never appeared" >&2
          exit 1

      - name: RPC into example daemon
        working-directory: example/_build/prod/rel/example
        run: |
          out=$(./bin/example rpc 'IO.puts inspect(Example.hello())')
          echo "rpc returned: $out"
          [ "$out" = ":world" ]

      - name: Stop example daemon
        working-directory: example/_build/prod/rel/example
        run: ./bin/example stop
