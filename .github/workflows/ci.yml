name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        elixir: ['1.18', '1.19', '1.20']
        otp: ['27', '28', '29']
        exclude:
          - elixir: '1.18'
            otp: '28'
          - elixir: '1.18'
            otp: '29'
          - elixir: '1.19'
            otp: '29'
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          version-type: loose

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get
      - run: mix precommit
      - run: mix test --only stress

      - name: Build example release
        working-directory: example
        run: |
          mix deps.get
          MIX_ENV=prod mix release

      - name: Start example daemon
        working-directory: example/_build/prod/rel/example
        run: |
          ./bin/example daemon
          for _ in $(seq 1 20); do
            [ -S example.sock ] && exit 0
            sleep 0.5
          done
          echo "example.sock never appeared" >&2
          exit 1

      - name: RPC into example daemon
        working-directory: example/_build/prod/rel/example
        run: |
          out=$(./bin/example rpc 'IO.puts inspect(Example.hello())')
          echo "rpc returned: $out"
          [ "$out" = ":world" ]

      - name: Stop example daemon
        working-directory: example/_build/prod/rel/example
        run: ./bin/example stop

  publish:
    name: Publish to Hex.pm
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.3'
          elixir-version: '1.19.5'
          version-type: strict

      - name: Verify release tag
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*@version "\([^"]*\)"[[:space:]]*$/\1/p' mix.exs)

          if [ -z "$version" ]; then
            echo "Could not read @version from mix.exs" >&2
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit is not on origin/main" >&2
            exit 1
          fi

      - run: mix deps.get

      - name: Publish package and documentation
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "HEX_API_KEY repository secret is not configured" >&2
            exit 1
          fi

          mix hex.publish --yes
